name: 构建 APK

# 在 GitHub 的服务器上编译安卓 App，产物 APK 可在本次运行页面直接下载。
# 触发方式：推送到本分支时自动构建；也可在 Actions 页面手动点 "Run workflow"。

on:
  push:
    branches:
      - "**"
    paths:
      - "android-forwarder/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受许可并安装 SDK 组件
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew
        working-directory: android-forwarder

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android-forwarder

      - name: 重命名 APK
        run: cp android-forwarder/app/build/outputs/apk/debug/app-debug.apk wx-forward.apk

      - name: 上传 APK 产物（备用，会过期）
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: wx-forward.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Releases（永久下载链接，推荐用这个）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 最新 APK（微信内网转发）
          body: |
            手机浏览器直接点下面的 wx-forward.apk 即可下载安装。
            每次代码更新后这里都会自动替换为最新版本。
          files: wx-forward.apk
          make_latest: "true"
